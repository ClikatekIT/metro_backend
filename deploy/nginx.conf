server {
    listen 80;
    server_name api.metrojobs.co.mz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.metrojobs.co.mz;

    ssl_certificate /etc/letsencrypt/live/api.metrojobs.co.mz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.metrojobs.co.mz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/metro-backend/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn/metro.sock;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
